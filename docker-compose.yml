services:
  melodija:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3333:3333"
    environment:
      NODE_ENV: production
      MELODIJA_DB: /data/melodija.db
      MELODIJA_BACKUP_DIR: /data/backups
    volumes:
      - ./melodija.db:/data/melodija.db:rw
      - ./backups:/data/backups:rw
    restart: unless-stopped
